name: ShiftAlarm

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ShiftAlarm:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ShiftAlarm
        PRODUCT_NAME: ShiftAlarm
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        SWIFT_STRICT_CONCURRENCY: minimal
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 班表闹钟
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Automatic
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # AlarmKit 必须声明用途，否则 requestAuthorization 会被系统拒绝
        NSAlarmKitUsageDescription: 班表闹钟会在班次开始前用系统闹钟提醒你，手机静音或开启专注模式时也能响铃。

schemes:
  ShiftAlarm:
    build:
      targets:
        ShiftAlarm: all
    run:
      config: Debug
    archive:
      config: Release
